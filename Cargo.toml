[workspace]
resolver = "3"
members = [
    "src-tauri",
    "crates/officeforge-core",
    "crates/officeforge-writer",
    "crates/officeforge-sheets",
    "crates/officeforge-slides",
    "crates/officeforge-ooxml",
    "crates/officeforge-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["OfficeForge Contributors"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
quick-xml = { version = "0.37", features = ["serialize"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
indexmap = { version = "2", features = ["serde"] }
regex = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
